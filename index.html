<script>

function safeJson(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):fallback;
  }catch(e){
    console.warn('localStorage JSON parse failed:',key,e);
    return fallback;
  }
}
const state={
  mode:'daily',
  actionMode:'normal',
  openMenu:null,
  selectedAccount:null,
  selectedChar:'all',
  accounts:[],
  chars:[],
  tasks:{},
  expTasks:{},
  raidTasks:{},
  currencies:{},
  notes:{},
  presets:{},
  raidGroupSettings:{},
  hiddenAccounts:new Set(safeJson('la_hidden_accs',[])),
  showHiddenAccounts:false,
  collapsedCurrency:new Set(safeJson('la_redesign_collapsed_currency',[])),
  collapsedRaid:new Set(safeJson('la_redesign_collapsed_raid',[])),
  collapsedNotes:new Set(safeJson('la_redesign_collapsed_notes',[])),
  hideCompleted:localStorage.getItem('la_redesign_hide_done')==='1',
  showInactive:localStorage.getItem('la_redesign_show_inactive')==='1',
  busy:new Set(),
  createType:'rest',
  createTarget:null,
  createParentId:null,
  editTarget:null,
  taskIconUrl:null,
  raidAddCharId:null,
  editAccountId:null,
  editCharacterId:null,
  editCurrencyId:null,
  editCurrencyCharId:null,
  currencyIconUrl:null,
  viewNoteId:null,
  viewNoteCharId:null,
  editBlocks:[],
  copyCtx:null,
  bulkCtx:null,
  tempRaidTaskIds:new Set(),
  tempRemovedRaidTaskIds:new Set(),
  tempRemovedPresetByTask:{},
  dragCtx:null,
  viewScrolls:{},
  lostarkApiToken:'',
  lostarkApiSave:!!localStorage.getItem('la_lostark_api_token'),
  apiUpdateExcluded:new Set(safeJson('la_lostark_update_excluded',[])),
  lastResetBoundaryKey:null,
  resetRefreshRunning:false
};
let clockTimer=null;
let resetCacheTick=null;
const resetCache=new Map();

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function iconImg(url,cls=''){return url?`<span class="${cls||'task-icon'}"><img src="${esc(url)}" alt="" loading="lazy"></span>`:'';}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}
function getConfig(){const url=localStorage.getItem('la_url'),key=localStorage.getItem('la_key');return url&&key?{url,key}:null;}
function saveConfig(){const url=document.getElementById('setup-url').value.trim(),key=document.getElementById('setup-key').value.trim();if(!url||!key){toast('URL怨?key瑜??낅젰?섏꽭??);return;}localStorage.setItem('la_url',url);localStorage.setItem('la_key',key);init();}
function appNow(){const t=Number(localStorage.getItem('la_test_now')||0);return Number.isFinite(t)&&t>0?new Date(t):new Date();}
function isTestMode(){return !!localStorage.getItem('la_test_now');}
function appNowIso(){return appNow().toISOString();}
function getLatestCurrencyUpdated(list){const ds=(list||[]).map(c=>c.updated_at).filter(Boolean).sort((a,b)=>new Date(b)-new Date(a));return ds[0]||'';}
function fmtRelDate(iso){if(!iso)return'';const d=new Date(iso);return`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function updateClock(){const k=new Date(appNow().getTime()+9*3600000),p=n=>String(n).padStart(2,'0'),isTest=!!localStorage.getItem('la_test_now');document.getElementById('clock').textContent=`KST ${p(k.getUTCHours())}:${p(k.getUTCMinutes())} (${DAYS[k.getUTCDay()]})`;const badge=document.getElementById('test-badge');if(badge)badge.classList.toggle('on',isTest);}
function toLocalDateTimeValue(ms){const d=new Date(ms),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function openSettings(){const c=getConfig();document.getElementById('set-url').value=c?.url||'';document.getElementById('set-key').value=c?.key||'';const td=localStorage.getItem('la_test_now');document.getElementById('set-test-date').value=td?toLocalDateTimeValue(Number(td)):'';openModal('modal-settings');}
function saveSettings(){const u=document.getElementById('set-url').value.trim(),k=document.getElementById('set-key').value.trim();if(!u||!k){toast('URL怨?key瑜??낅젰?섏꽭??);return;}localStorage.setItem('la_url',u);localStorage.setItem('la_key',k);const tv=document.getElementById('set-test-date').value;if(tv){const ms=new Date(tv).getTime();if(Number.isFinite(ms))localStorage.setItem('la_test_now',String(ms));else localStorage.removeItem('la_test_now');}else{localStorage.removeItem('la_test_now');}closeModal('modal-settings');location.reload();}
function fillTestDateNow(){document.getElementById('set-test-date').value=toLocalDateTimeValue(Date.now());}
function clearTestDate(){document.getElementById('set-test-date').value='';localStorage.removeItem('la_test_now');updateClock();toast('?뚯뒪??紐⑤뱶瑜?猿먯뒿?덈떎. ?먮옒 ?곹깭濡??ㅼ떆 遺덈윭?듬땲??');location.reload();}
function clearConfig(){if(!confirm('Supabase ?곌껐???댁젣?⑸땲?? ?곗씠?곕뒗 蹂댁〈?⑸땲??\n怨꾩냽?좉퉴??'))return;localStorage.removeItem('la_url');localStorage.removeItem('la_key');location.reload();}
function ensureClock(){
  if(clockTimer)clearInterval(clockTimer);
  updateClock();
  clockTimer=setInterval(()=>{updateClock();checkResetBoundaryForOpenPage();},30000);
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function withBusy(key){if(state.busy.has(key))return false;state.busy.add(key);return true;}
function clearBusy(key){state.busy.delete(key);}

function setActionMode(mode){
  state.actionMode=state.actionMode===mode?'normal':mode;
  state.openMenu=null;
  render();
}
function finishActionMode(){
  state.actionMode='normal';
  state.openMenu=null;
  render();
}
function toggleToolMenu(menu){
  state.openMenu=state.openMenu===menu?null:menu;
  render();
}
function applyActionMode(){
  document.body.classList.toggle('action-copy',state.actionMode==='copy');
  document.body.classList.toggle('action-edit',state.actionMode==='edit');
  document.body.classList.toggle('action-delete',state.actionMode==='delete');
  document.body.classList.toggle('action-order',false);
  document.body.classList.toggle('manage-active',state.actionMode!=='normal');
  document.querySelectorAll('.mode-action').forEach(b=>b.classList.toggle('active',b.dataset.action===state.actionMode));
  const doneBtn=document.getElementById('mode-done-btn');
  if(doneBtn){
    const label={edit:'?섏젙 ?꾨즺',copy:'蹂듭젣 ?꾨즺',delete:'??젣 ?꾨즺'}[state.actionMode]||'紐⑤뱶 ?꾨즺';
    doneBtn.textContent=label;
  }
  document.querySelectorAll('.tool-pop').forEach(pop=>pop.classList.remove('open'));
  const pop=document.getElementById(`${state.openMenu}-panel`);
  if(pop)pop.classList.add('open');
  const hd=document.getElementById('hide-done-switch');
  const ia=document.getElementById('show-inactive-switch');
  if(hd)hd.classList.toggle('on',state.hideCompleted);
  if(ia)ia.classList.toggle('on',state.showInactive);
  document.querySelectorAll('.daily-tool').forEach(el=>el.classList.toggle('hidden',state.mode!=='daily'));
  const apiSave=document.getElementById('lostark-api-save-switch');
  if(apiSave)apiSave.classList.toggle('on',state.lostarkApiSave);
}

async function init(){
  const cfg=getConfig();
  if(!cfg){
    document.getElementById('setup').style.display='flex';
    document.getElementById('app').classList.remove('active');
    return;
  }
  document.getElementById('setup').style.display='none';
  document.getElementById('app').classList.add('active');
  sb=createClient(cfg.url,cfg.key);
  ensureClock();
  await reloadAll();
}

async function reloadAll(){
  toast('?곗씠?곕? 遺덈윭?ㅻ뒗 以?..');
  const [accRes,charRes]=await Promise.all([
    sb.from('accounts').select('*').order('sort_order').order('created_at'),
    sb.from('characters').select('*').order('sort_order').order('created_at')
  ]);
  if(accRes.error||charRes.error){toast('?곗씠??濡쒕뵫 ?ㅽ뙣');console.error(accRes.error||charRes.error);return;}
  state.accounts=accRes.data||[];
  state.chars=charRes.data||[];
  const firstVisible=visibleAccounts()[0]||state.accounts[0]||null;
  if(!state.selectedAccount||!state.accounts.some(a=>a.id===state.selectedAccount)||(!state.showHiddenAccounts&&state.hiddenAccounts.has(state.selectedAccount)))state.selectedAccount=firstVisible?.id||null;
  await loadAccountData();
  state.lastResetBoundaryKey=getOpenPageResetBoundaryKey();
  render();
  toast('遺덈윭?붿뒿?덈떎');
}

async function loadAccountData(){
  const charIds=state.chars.map(c=>c.id);
  const accIds=state.accounts.map(a=>a.id);
  const [taskRes,raidRes,currencyRes,noteRes,expRes]=await Promise.all([
    fetchRowsByOwner('tasks','character_id',charIds),
    fetchRowsByOwner('raid_tasks','character_id',charIds),
    fetchRowsByOwner('currencies','character_id',charIds),
    fetchRowsByOwner('custom_popups','character_id',charIds),
    fetchRowsByOwner('expedition_tasks','account_id',accIds)
  ]);
  state.tasks=taskRes.buckets;
  state.raidTasks=raidRes.buckets;
  state.currencies=currencyRes.buckets;
  state.notes=noteRes.buckets;
  state.expTasks=expRes.buckets;
  await Promise.all([
    autoResetTasks(taskRes.rows,'tasks'),
    autoResetRaidList(raidRes.rows),
    autoResetTasks(expRes.rows,'expedition_tasks')
  ]);
  await loadRaidMetaForCurrent();
}

async function fetchRowsByOwner(table,ownerField,ownerIds){
  const buckets={};
  ownerIds.forEach(id=>{buckets[id]=[];});
  if(!ownerIds.length)return{rows:[],buckets};
  const {data,error}=await sb.from(table).select('*').in(ownerField,ownerIds).order('sort_order').order('created_at');
  if(error){console.warn(error);return{rows:[],buckets};}
  const rows=data||[];
  rows.forEach(row=>{
    const ownerId=row[ownerField];
    if(!buckets[ownerId])buckets[ownerId]=[];
    buckets[ownerId].push(row);
  });
  return{rows,buckets};
}

function selectedAccount(){return state.accounts.find(a=>a.id===state.selectedAccount)||null;}
function isAccountHidden(id){return state.hiddenAccounts.has(id);}
function visibleAccounts(){return state.accounts.filter(a=>state.showHiddenAccounts||!isAccountHidden(a.id));}
function targetVisibleAccounts(){return state.accounts.filter(a=>!isAccountHidden(a.id));}
function targetCharLabel(c){
  const level=c.item_level?`Lv.${Number(c.item_level).toLocaleString()}`:'';
  return`<span class="target-main">${esc(c.name)}</span>${level?`<span class="target-level">${level}</span>`:''}${c.class_name?`<span class="target-class">${esc(c.class_name)}</span>`:''}`;
}
function selectedCharsForAccount(){return state.chars.filter(c=>c.account_id===state.selectedAccount);}
function visibleChars(){return selectedCharsForAccount();}
function setMode(mode){if(mode===state.mode)return;saveViewScroll(state.mode);state.mode=mode;state.selectedChar='all';render();}
async function selectAccount(id){state.selectedAccount=id;state.selectedChar='all';await loadRaidMetaForCurrent();render();}
function selectChar(id){state.selectedChar=id;render();}
async function showPartyLinkPopup(presetId,taskId,charId){
  const el=document.getElementById('party-link-content');
  if(!el)return;
  el.innerHTML='<div class="empty">?뚰떚 ?뺣낫瑜?遺덈윭?ㅻ뒗 以?..</div>';

function getRaidWeekKey(){
  const now=appNow(),kst=new Date(now.getTime()+9*3600000);
  let back=(kst.getUTCDay()-3+7)%7;
  if(back===0&&kst.getUTCHours()<6)back=7;
  const ws=new Date(kst);
  ws.setUTCDate(ws.getUTCDate()-back);
  ws.setUTCHours(6,0,0,0);
  return`${ws.getUTCFullYear()}-${String(ws.getUTCMonth()+1).padStart(2,'0')}-${String(ws.getUTCDate()).padStart(2,'0')}`;
}
async function loadTempRaidTaskIds(){
  const wk=getRaidWeekKey();
  const {data,error}=await sb.from('raid_schedule_overrides').select('schedule_id,temp_changes').eq('week_start_date',wk);
  if(error)return;
  const addedIds=[],removedIds=[],removedBySchedule=[];
  (data||[]).forEach(o=>{
    const added=o.temp_changes?.added||{},removed=o.temp_changes?.removed||{};
    Object.values(added).forEach(v=>{if(v?.taskId)addedIds.push(v.taskId);});
    Object.values(removed).forEach(v=>{if(v?.taskId){removedIds.push(v.taskId);removedBySchedule.push({taskId:v.taskId,scheduleId:o.schedule_id});}});
  });
  state.tempRaidTaskIds=new Set(addedIds);
  state.tempRemovedRaidTaskIds=new Set(removedIds);
  if(!removedBySchedule.length)return;
  const scheduleIds=[...new Set(removedBySchedule.map(x=>x.scheduleId).filter(Boolean))];
  const {data:schRows,error:schErr}=await sb.from('raid_schedules').select('id,party_id').in('id',scheduleIds);
  if(schErr||!schRows?.length)return;
  const partyIds=[...new Set(schRows.map(s=>s.party_id).filter(Boolean))];
  const {data:partyRows,error:partyErr}=await sb.from('raid_parties').select('id,preset_id').in('id',partyIds);
  if(partyErr||!partyRows?.length)return;
  const presetIds=[...new Set(partyRows.map(p=>p.preset_id).filter(Boolean))];
  if(!presetIds.length)return;
  const {data:presetRows,error:presetErr}=await sb.from('raid_presets').select('*').in('id',presetIds);
  if(presetErr)return;
  const partyPreset={},presetMap={},schedulePreset={};
  partyRows.forEach(p=>{partyPreset[p.id]=p.preset_id;});
  (presetRows||[]).forEach(p=>{presetMap[p.id]=p;state.presets[p.id]=p;});
  schRows.forEach(s=>{schedulePreset[s.id]=presetMap[partyPreset[s.party_id]];});
  removedBySchedule.forEach(x=>{if(schedulePreset[x.scheduleId])state.tempRemovedPresetByTask[x.taskId]=schedulePreset[x.scheduleId];});
}

function getLastResetUTC(type,day){
  const now=appNow();
  const tick=Math.floor(now.getTime()/60000);
  if(resetCacheTick!==tick){
    resetCacheTick=tick;
    resetCache.clear();
  }
  const cacheKey=`${type||'daily'}:${day??''}`;
  const cached=resetCache.get(cacheKey);
  if(cached)return cached;
  let result;
  if(type==='daily'){
    result=new Date(now);
    result.setUTCHours(21,0,0,0);
    if(now<result)result.setUTCDate(result.getUTCDate()-1);
  }else if(type==='monthly'){
    const kst=new Date(now.getTime()+9*3600000);
    result=new Date(Date.UTC(kst.getUTCFullYear(),kst.getUTCMonth(),0,21,0,0,0));
    if(now<result)result=new Date(Date.UTC(kst.getUTCFullYear(),kst.getUTCMonth()-1,0,21,0,0,0));
  }else{
    const rDay=(Number(day)+6)%7;
    result=new Date(now);
    result.setUTCHours(21,0,0,0);
    let back=(now.getUTCDay()-rDay+7)%7;
    if(back===0&&now<result)back=7;
    result.setUTCDate(result.getUTCDate()-back);
  }
  resetCache.set(cacheKey,result);
  return result;
}

function getResetBoundariesSince(t,latest){
  const type=t.reset_type||'daily';
  const created=t.created_at?new Date(t.created_at):latest;
  const cursor=t.rest_last_processed_at?new Date(t.rest_last_processed_at):new Date(created.getTime()-1000);
  const stack=[];
  let b=new Date(latest);
  // Cap iterations to prevent infinite loops on bad data (~62 cycles is plenty)
  while(b>cursor&&stack.length<62){
    stack.unshift(new Date(b));
    b=getPreviousResetBoundary(type,b);
  }
  return stack.filter(x=>x>cursor&&x<=latest);
}
function getPreviousResetBoundary(type,boundary){
  const prev=new Date(boundary);
  if(type==='daily'){
    prev.setUTCDate(prev.getUTCDate()-1);
    return prev;
  }
  if(type==='monthly'){
    const kst=new Date(prev.getTime()+9*3600000);
    return new Date(Date.UTC(kst.getUTCFullYear(),kst.getUTCMonth()-1,0,21,0,0,0));
  }
  prev.setUTCDate(prev.getUTCDate()-7);
  return prev;
}

async function autoResetTasks(list,table){
  if(!list||!list.length)return;
  const updates=[];
  for(const t of list){
    const latest=getLastResetUTC(t.reset_type||'daily',t.reset_day??3);
    const up={};
    if(t.rest_enabled){
      let cur=Math.max(0,Number(t.rest_current)||0);
      const max=Math.max(1,Number(t.rest_max)||200);
      const charge=Math.max(0,Number(t.rest_charge)||0);
      const boundaries=getResetBoundariesSince(t,latest);
      const completedAt=t.last_completed_at?new Date(t.last_completed_at):null;
      boundaries.forEach(b=>{
        const prev=getPreviousResetBoundary(t.reset_type||'daily',b);
        const completedInCycle=!!(completedAt&&completedAt>prev&&completedAt<=b);
        if(!completedInCycle){
          cur=Math.min(max,cur+charge);
        }
      });
      if(boundaries.length){
        up.rest_current=cur;
        up.rest_last_processed_at=latest.toISOString();
        up.count_current=0;
        up.rest_consumed_current_cycle=0;
      }
    }
    if(t.is_completed&&!isDone(t)){
      up.is_completed=false;
      up.last_completed_at=null;
      up.count_current=0;
      up.rest_consumed_current_cycle=0;
    }
    if(Object.keys(up).length)updates.push({t,up});
  }
  if(!updates.length)return;
  if(isTestMode()){
    updates.forEach(x=>Object.assign(x.t,x.up));
    return;
  }
  await Promise.all(updates.map(async x=>{
    const {error}=await sb.from(table).update(x.up).eq('id',x.t.id);
    if(!error)Object.assign(x.t,x.up);
  }));
}

function countIsCurrent(t){
  return !!(t.last_completed_at&&new Date(t.last_completed_at)>getLastResetUTC(t.reset_type||'daily',t.reset_day||3));
}
function effectiveCount(t){return countIsCurrent(t)?Number(t.count_current)||0:0;}
function isRaidTaskRecord(t){return !!(t&&('preset_id' in t||'clear_gold' in t||'bound_gold' in t||'bonus_gold' in t));}
function isDone(t){
  if(isRaidTaskRecord(t))return !!(t.is_completed&&t.last_completed_at&&new Date(t.last_completed_at)>getLastResetUTC('weekly',t.reset_day??3));
  const current=countIsCurrent(t);
  if(t.rest_enabled){
    const max=Math.max(1,Number(t.rest_daily_limit)||1);
    if(current&&Number(t.count_current||0)>=max)return true;
  }
  if(t.count_max!=null&&current&&Number(t.count_current||0)>=Number(t.count_max||0))return true;
  return !!(t.is_completed&&t.last_completed_at&&new Date(t.last_completed_at)>getLastResetUTC(t.reset_type||'daily',t.reset_day||3));
}
function isActive(t){
  if(t.rest_enabled&&Number(t.rest_current||0)<Number(t.rest_threshold||0))return false;
  if(t.activate_day==null)return true;
  return getLastResetUTC('weekly',t.activate_day)>=getLastResetUTC(t.reset_type||'daily',t.reset_day||3);
}

function isWeeklyMonthly(t){return (t.reset_type||'daily')!=='daily';}

function restInfo(t){
  const max=Math.max(1,Number(t.rest_max)||100);
  const cur=Math.max(0,Math.min(Number(t.rest_current)||0,max));
  const charge=Math.max(1,Number(t.rest_charge)||10);
  const consume=Math.max(0,Number(t.rest_consume)||20);
  const totalCells=Math.max(1,Math.ceil(max/charge));
  const cellsPerUse=Math.max(1,consume?Math.round(consume/charge):1);
  return{max,cur,charge,consume,totalCells,cellsPerUse,threshold:Math.max(0,Number(t.rest_threshold)||0)};
}

function buildTaskTree(list){
  const roots=(list||[]).filter(t=>!t.parent_id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const children={};
  (list||[]).filter(t=>t.parent_id).forEach(t=>{
    if(!children[t.parent_id])children[t.parent_id]=[];
    children[t.parent_id].push(t);
  });
  Object.values(children).forEach(arr=>arr.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)));
  return{roots,children};
}
function renderTaskGroups(list,isExp,ownerId,predicate){
  const filtered=(list||[]).filter(t=>predicate(t));
  const tree=buildTaskTree(filtered);
  const roots=applyTaskFilters(tree.roots);
  if(!roots.length)return '<div class="empty">?숈젣媛 ?놁뒿?덈떎</div>';
  return roots.map((t,i)=>taskGroup(t,tree.children[t.id]||[],isExp,ownerId,i)).join('');
}
function taskGroup(t,children,isExp,ownerId,idx){
  const visibleChildren=applyTaskFilters(children);
  const childDone=children.filter(isDone).length;
  return`<div class="task-group">
    ${taskRow(t,isExp,ownerId,false,idx,children)}
    ${visibleChildren.length?`<div class="subtask-list">${visibleChildren.map((c,i)=>taskRow(c,isExp,ownerId,true,i,[])).join('')}</div>`:''}
    ${children.length?`<div class="tiny" style="padding-left:18px">?섏쐞 ?숈젣 ${childDone}/${children.length}</div>`:''}
  </div>`;
}

function stepDots(t,isExp,ownerId){
  const max=Number(t.count_max)||1,cur=effectiveCount(t);
  let html='<div class="step-wrap">';
  for(let i=1;i<=max;i++){const next=cur===i?i-1:i;html+=`<button class="step-dot ${cur>=i?'on':''}" onclick="setTaskCount('${t.id}',${isExp},'${ownerId}',${next})">${i}</button>`;}
  return html+'</div>';
}
function restCountButtons(t,isExp,ownerId){
  const max=Math.max(1,Number(t.rest_daily_limit)||1),cur=effectiveCount(t);
  let html='<div class="count-wrap">';
  for(let i=1;i<=max;i++){const next=cur===i?i-1:i;html+=`<button class="count-btn ${cur>=i?'on':''}" onclick="setRestTaskCount('${t.id}',${isExp},'${ownerId}',${next})">${i}</button>`;}
  return html+'</div>';
}
function restBox(t,isExp,ownerId){
  const r=restInfo(t),groups=[];
  for(let i=0;i<r.totalCells;i+=r.cellsPerUse){
    const start=i*r.charge,end=Math.min(r.max,(i+r.cellsPerUse)*r.charge);
    const pct=Math.max(0,Math.min(100,((r.cur-start)/(end-start))*100));
    groups.push(`<div class="rest-group" style="--fill:${pct}%" title="${start} - ${end}" onclick="setRestFromGroup(event,'${t.id}',${isExp},'${ownerId}',${start},${end},${r.charge})"></div>`);
  }
  const ready=r.threshold>0&&r.cur>=r.threshold;
  return`<div class="rest-box ${ready?'rest-ready':''}"><div class="rest-line"><span>${r.threshold>0?`媛뺤“ ${r.threshold} 쨌 `:''}異⑹쟾 ${r.charge}</span><b>${r.cur}/${r.max}</b></div><div class="rest-segments">${groups.join('')}</div></div>`;
}
function setRestFromGroup(e,id,isExp,ownerId,start,end,charge){
  const rect=e.currentTarget.getBoundingClientRect();
  const width=Math.max(1,rect.width);
  const ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/width));
  let val=start+Math.ceil(((end-start)*ratio)/Math.max(1,charge))*Math.max(1,charge);
  if(start===0&&ratio<=0.08)val=0;
  setRest(id,isExp,ownerId,Math.max(0,Math.min(end,val)));
}

async function toggleTask(id,isExp,ownerId){
  const key=`task:${id}`;if(!withBusy(key))return;
  const list=isExp?(state.expTasks[ownerId]||[]):(state.tasks[ownerId]||[]);
  const t=list.find(x=>x.id===id);if(!t){clearBusy(key);return;}
  if(list.some(x=>x.parent_id===id)){clearBusy(key);toast('?곸쐞 ?숈젣???섏쐞 ?숈젣 ?꾨즺濡??먮룞 泥섎━?⑸땲??);return;}
  const done=!isDone(t),up={is_completed:done,last_completed_at:done?appNowIso():null};
  if(t.count_max!=null)up.count_current=done?t.count_max:0;
  const prev={is_completed:t.is_completed,last_completed_at:t.last_completed_at,count_current:t.count_current};
  Object.assign(t,up);
  render();
  if(isTestMode()){clearBusy(key);if(t.parent_id){await syncParentDone(t.parent_id,isExp,ownerId);render();}return;}
  const {error}=await sb.from(isExp?'expedition_tasks':'tasks').update(up).eq('id',id);
  clearBusy(key);
  if(error){Object.assign(t,prev);render();}
  if(error){toast('????ㅽ뙣');return;}
  if(t.parent_id){await syncParentDone(t.parent_id,isExp,ownerId);render();}
}
async function setTaskCount(id,isExp,ownerId,val){
  const key=`task:${id}`;if(!withBusy(key))return;
  const list=isExp?(state.expTasks[ownerId]||[]):(state.tasks[ownerId]||[]);
  const t=list.find(x=>x.id===id);if(!t){clearBusy(key);return;}
  if(list.some(x=>x.parent_id===id)){clearBusy(key);toast('?곸쐞 ?숈젣???섏쐞 ?숈젣 ?꾨즺濡??먮룞 泥섎━?⑸땲??);return;}
  const max=Number(t.count_max)||1,cur=Math.max(0,Math.min(Number(val)||0,max)),done=cur>=max;
  const up={count_current:cur,is_completed:done,last_completed_at:cur>0?appNowIso():null};
  const prev={count_current:t.count_current,is_completed:t.is_completed,last_completed_at:t.last_completed_at};
  Object.assign(t,up);
  render();
  if(isTestMode()){clearBusy(key);if(t.parent_id){await syncParentDone(t.parent_id,isExp,ownerId);render();}return;}
  const {error}=await sb.from(isExp?'expedition_tasks':'tasks').update(up).eq('id',id);

function applyRestCompletionChange(t,nextCount){
  const maxCount=Math.max(1,Number(t.rest_daily_limit)||1);
  const prevCount=countIsCurrent(t)?Math.max(0,Math.min(Number(t.count_current)||0,maxCount)):0;
  const curCount=Math.max(0,Math.min(Number(nextCount)||0,maxCount));
  const restMax=Math.max(1,Number(t.rest_max)||200);
  const consume=Math.max(0,Number(t.rest_consume)||0);
  let restCurrent=Math.max(0,Math.min(Number(t.rest_current)||0,restMax));
  let consumed=Math.max(0,Number(t.rest_consumed_current_cycle)||0);
  if(curCount>prevCount){
    for(let i=0;i<curCount-prevCount;i++){
      if(consume>0&&restCurrent>=consume){
        restCurrent=Math.max(0,restCurrent-consume);
        consumed+=consume;
      }
    }
  }else if(curCount<prevCount){
    for(let i=0;i<prevCount-curCount;i++){
      const refund=Math.min(consume,consumed);
      if(refund>0){
        restCurrent=Math.min(restMax,restCurrent+refund);
        consumed-=refund;
      }
    }
  }
  return{rest_current:restCurrent,rest_consumed_current_cycle:consumed};
}

async function cleanupRaidPartyLinksForTask(t){
  if(!t?.preset_id||!t?.character_id)return;
  try{
    const {data:partyRows,error:partyErr}=await sb.from('raid_parties').select('id').eq('preset_id',t.preset_id);
    if(partyErr){console.warn(partyErr);return;}
    const partyIds=(partyRows||[]).map(p=>p.id);
    if(!partyIds.length)return;
    const memberRes=await sb.from('raid_party_members').delete().in('party_id',partyIds).eq('character_id',t.character_id);
    if(memberRes.error)console.warn(memberRes.error);
    const {data:scheduleRows,error:scheduleErr}=await sb.from('raid_schedules').select('id').in('party_id',partyIds);
    if(scheduleErr){console.warn(scheduleErr);return;}
    const scheduleIds=(scheduleRows||[]).map(s=>s.id);
    if(!scheduleIds.length)return;
    const {data:overrideRows,error:overrideErr}=await sb.from('raid_schedule_overrides').select('id,slot_overrides,temp_changes').in('schedule_id',scheduleIds);
    if(overrideErr){console.warn(overrideErr);return;}
    await Promise.all((overrideRows||[]).map(async row=>{
      const slotOverrides={...(row.slot_overrides||{})};
      const tempChanges={added:{...((row.temp_changes||{}).added||{})},removed:{...((row.temp_changes||{}).removed||{})}};
      let changed=false;
      Object.keys(slotOverrides).forEach(k=>{if(slotOverrides[k]===t.character_id){slotOverrides[k]=null;changed=true;}});
      const addInfo=tempChanges.added[t.character_id];
      if(addInfo&&(!(addInfo.taskId||addInfo.task_id)||(addInfo.taskId||addInfo.task_id)===t.id)){delete tempChanges.added[t.character_id];changed=true;}
      const remInfo=tempChanges.removed[t.character_id];
      if(remInfo&&(!(remInfo.taskId||remInfo.task_id)||(remInfo.taskId||remInfo.task_id)===t.id)){delete tempChanges.removed[t.character_id];changed=true;}
      if(!changed)return;
      const {error}=await sb.from('raid_schedule_overrides').update({slot_overrides:slotOverrides,temp_changes:tempChanges}).eq('id',row.id);
      if(error)console.warn(error);
    }));
  }catch(err){console.warn('raid party link cleanup failed:',err);}
}

async function fetchLostarkProfile(characterName,token){
  const url=`https://developer-lostark.game.onstove.com/armories/characters/${encodeURIComponent(characterName)}?filters=profiles`;
  let res;
  try{
    res=await fetch(url,{headers:{accept:'application/json',authorization:`bearer ${token}`}});
  }catch(e){
    throw new Error('怨듭떇 API ?붿껌 ?ㅽ뙣');
  }
  if(res.status===401||res.status===403)throw new Error('API ??沅뚰븳 ?뺤씤 ?꾩슂');
  if(res.status===404)throw new Error('罹먮┃???놁쓬');
  if(res.status===429)throw new Error('?붿껌 ?쒗븳');
  if(!res.ok)throw new Error(`API ?ㅻ쪟 ${res.status}`);
  const data=await res.json();
  const profile=data?.ArmoryProfile;
  if(!profile)throw new Error('?꾨줈???놁쓬');
  return profile;
}
function setApiProgress(done,total,label){

}

async function runCharacterApiUpdate(){
  const raw=document.getElementById('lostark-api-token')?.value||'';
  const token=normalizeLostarkToken(raw);
  if(!token){toast('API ?ㅻ? ?낅젰?섏꽭??);return;}
  state.lostarkApiToken=token;
  if(state.lostarkApiSave)localStorage.setItem('la_lostark_api_token',token);else localStorage.removeItem('la_lostark_api_token');
  state.apiUpdateExcluded=apiExcludedFromDom();
  localStorage.setItem('la_lostark_update_excluded',JSON.stringify([...state.apiUpdateExcluded]));
  const targets=state.chars.filter(ch=>!state.apiUpdateExcluded.has(ch.id));
  if(!targets.length){toast('?낅뜲?댄듃 ??곸씠 ?놁뒿?덈떎');return;}
  const btn=document.getElementById('api-update-run-btn');
  if(btn)btn.disabled=true;
  const log=document.getElementById('api-update-log');
  if(log)log.innerHTML='';
  let ok=0,fail=0;
  setApiProgress(0,targets.length,'怨듭떇 API ?낅뜲?댄듃 ?쒖옉');
  for(let i=0;i<targets.length;i++){
    const ch=targets[i];
    setApiProgress(i,targets.length,`${ch.name} 議고쉶 以?);
    try{
      const profile=await fetchLostarkProfile(ch.name,token);
      const apiName=String(profile.CharacterName||ch.name).trim();
      const itemLevel=parseApiNumber(profile.ItemAvgLevel);
      const combatPower=parseApiNumber(profile.CombatPower);
      if(!Number.isFinite(itemLevel)||!Number.isFinite(combatPower))throw new Error('?덈꺼/?꾪닾??媛??놁쓬');
      const target=state.chars.find(c=>String(c.name||'').trim()===apiName)||ch;
      const payload={item_level:itemLevel,combat_power:combatPower};
      const {error}=await sb.from('characters').update(payload).eq('id',target.id);
      if(error)throw error;
      Object.assign(target,payload);
      appendApiLog(target.name,'?꾨즺',`Lv ${itemLevel.toLocaleString()} / ${combatPower.toLocaleString()}`,true);
      ok++;
    }catch(e){
      appendApiLog(ch.name,'?ㅽ뙣',e?.message||'?????녿뒗 ?ㅻ쪟',false);
      fail++;
    }
    setApiProgress(i+1,targets.length,`${i+1}/${targets.length} 泥섎━`);
  }
  render();
  setApiProgress(targets.length,targets.length,`?꾨즺: ?깃났 ${ok}, ?ㅽ뙣 ${fail}`);
  if(btn)btn.disabled=false;
  toast(`罹먮┃???낅뜲?댄듃 ?꾨즺: ?깃났 ${ok}, ?ㅽ뙣 ${fail}`);
}

async function dropOn(event,type,targetId,ownerId='',groupKey=''){
  event.preventDefault();
  const ctx=state.dragCtx;
  if(!ctx||ctx.type!==type||String(ctx.ownerId||'')!==String(ownerId||'')||String(ctx.groupKey||'')!==String(groupKey||'')||ctx.id===targetId)return;
  event.stopPropagation();
  clearDragMarks();
  state.dragCtx=null;
  let table=type,list=[],commit=()=>{};
  if(type==='accounts'){
    table='accounts';list=state.accounts.slice();
    commit=ordered=>{state.accounts=ordered;};
  }else if(type==='characters'){
    table='characters';list=selectedCharsForAccount().slice();
    commit=ordered=>{state.chars=state.chars.filter(c=>c.account_id!==state.selectedAccount).concat(ordered).sort((a,b)=>(a.account_id||'').localeCompare(b.account_id||'')||(a.sort_order||0)-(b.sort_order||0));};
  }else if(type==='tasks'||type==='expedition_tasks'){
    table=type;
    const isExp=type==='expedition_tasks',all=getTaskList(isExp,ownerId);
    list=all.filter(x=>String(x.parent_id||'')===String(groupKey||'')).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    commit=ordered=>{ordered.forEach((x,i)=>x.sort_order=i);};
  }else if(type==='raid_tasks'){
    table='raid_tasks';list=(state.raidTasks[ownerId]||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    commit=ordered=>{state.raidTasks[ownerId]=ordered;};
  }else if(type==='currencies'){
    table='currencies';list=(state.currencies[ownerId]||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    commit=ordered=>{state.currencies[ownerId]=ordered;};
  }else if(type==='custom_popups'){
    table='custom_popups';list=(state.notes[ownerId]||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    commit=ordered=>{state.notes[ownerId]=ordered;};
  }
  const from=list.findIndex(x=>x.id===ctx.id),to=list.findIndex(x=>x.id===targetId);
  if(from<0||to<0)return;
  const [item]=list.splice(from,1);
  list.splice(to,0,item);
  list.forEach((x,i)=>x.sort_order=i);
  commit(list);
  render();
  const {error}=await Promise.all(list.map((item,i)=>sb.from(table).update({sort_order:i}).eq('id',item.id))).then(results=>({error:results.find(r=>r.error)?.error}));
  if(error){toast('?쒖꽌 ????ㅽ뙣');console.warn(error);}
}
async function moveItem(type,id,dir,ownerId=null){
  let {list,table}=localListForMove(type,ownerId);
  if(type==='characters')list=list.slice();
  if(type==='accounts')list=list.slice();
  const idx=list.findIndex(x=>x.id===id),next=idx+dir;
  if(idx<0||next<0||next>=list.length)return;
  [list[idx],list[next]]=[list[next],list[idx]];
  list.forEach((x,i)=>x.sort_order=i);
  await persistOrder(table,list);
  if(type==='accounts'){state.accounts=list;}
  if(type==='characters'){state.chars=state.chars.filter(c=>c.account_id!==state.selectedAccount).concat(list).sort((a,b)=>(a.account_id||'').localeCompare(b.account_id||'')||(a.sort_order||0)-(b.sort_order||0));}
  render();
}
async function moveTask(id,isExp,ownerId,isChild,dir){
  const table=isExp?'expedition_tasks':'tasks';
  const all=getTaskList(isExp,ownerId);
  const t=all.find(x=>x.id===id);if(!t)return;
  const list=all.filter(x=>(x.parent_id||null)===(isChild?t.parent_id||null:null)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const idx=list.findIndex(x=>x.id===id),next=idx+dir;
  if(idx<0||next<0||next>=list.length)return;
  [list[idx],list[next]]=[list[next],list[idx]];
  list.forEach((x,i)=>x.sort_order=i);
  await persistOrder(table,list);
  render();
}

async function executeTaskCopy(){
  const ctx=state.copyCtx;if(!ctx)return;
  const targets=[...document.querySelectorAll('#copy-task-list [data-copy-target]:checked')].map(cb=>cb.value);
  if(!targets.length){toast('蹂듭젣????곸쓣 ?좏깮?섏꽭??);return;}
  const src=getTaskList(ctx.isExp,ctx.ownerId).find(x=>x.id===ctx.id);if(!src)return;
  const children=getTaskList(ctx.isExp,ctx.ownerId).filter(x=>x.parent_id===ctx.id);
  const table=ctx.isExp?'expedition_tasks':'tasks',ownerField=ctx.isExp?'account_id':'character_id';
  let groupId;
  try{groupId=await ensureCloneGroup(src,ctx.isExp);}catch{return;}
  let copied=0;
  for(const targetId of targets){
    const rootRec={...taskCopyFields(src),clone_group_id:groupId,[ownerField]:targetId,sort_order:localRootTaskCount(ctx.isExp,targetId)};
    const {data:newRoot,error}=await sb.from(table).insert(rootRec).select().single();
    if(error){console.warn(error);continue;}
    if(!ctx.isExp&&state.tasks[targetId])state.tasks[targetId].push(newRoot);
    if(ctx.isExp&&state.expTasks[targetId])state.expTasks[targetId].push(newRoot);
    if(children.length&&newRoot){
      const childRows=children.map((c,i)=>({...taskCopyFields(c),clone_group_id:null,[ownerField]:targetId,parent_id:newRoot.id,sort_order:i}));
      const {data:newChildren,error:childError}=await sb.from(table).insert(childRows).select();
      if(!childError&&newChildren){
        if(!ctx.isExp&&state.tasks[targetId])state.tasks[targetId].push(...newChildren);
        if(ctx.isExp&&state.expTasks[targetId])state.expTasks[targetId].push(...newChildren);
      }
    }
    copied++;
  }
  closeModal('modal-copy-task');
  render();
  toast(`${copied}媛???곸뿉 蹂듭젣?덉뒿?덈떎`);
}

async function submitCreatedTask(){
  const target=state.createTarget;if(!target){toast('??곸씠 ?놁뒿?덈떎');return;}
  const name=document.getElementById('task-name').value.trim();if(!name){toast('?숈젣紐낆쓣 ?낅젰?섏꽭??);return;}
  const resetType=document.getElementById('task-reset').value;
  const resetDay=resetType==='weekly'?Number(document.getElementById('task-reset-day').value):3;
  const activateDay=document.getElementById('task-activate-enabled').checked?Number(document.getElementById('task-activate-day').value):null;
  const rec={name,icon_url:state.taskIconUrl||null,reset_type:resetType,reset_day:resetDay,activate_day:activateDay,count_max:null,rest_enabled:false,rest_current:0,rest_max:200,rest_charge:20,rest_consume:40,rest_threshold:40,rest_daily_limit:1,rest_last_processed_at:null,rest_consumed_current_cycle:0};
  if(state.createType==='step'){rec.count_max=Math.max(2,Number(document.getElementById('step-max').value)||3);rec.count_current=0;}
  if(state.createType==='rest'){
    rec.rest_enabled=true;
    rec.rest_max=Math.max(1,Number(document.getElementById('rest-max').value)||100);
    rec.rest_current=Math.max(0,Math.min(Number(document.getElementById('rest-current').value)||0,rec.rest_max));
    rec.rest_charge=Math.max(0,Number(document.getElementById('rest-charge').value)||0);
    rec.rest_consume=Math.max(0,Number(document.getElementById('rest-consume').value)||0);
    rec.rest_threshold=Math.max(0,Number(document.getElementById('rest-threshold').value)||0);
    rec.rest_daily_limit=Math.max(1,Number(document.getElementById('rest-daily-limit').value)||1);
    rec.rest_last_processed_at=getLastResetUTC(resetType,resetDay).toISOString();
  }
  const isExp=target.scope==='account';
  const table=isExp?'expedition_tasks':'tasks';
  if(state.editTarget){
    const {id,ownerId}=state.editTarget;
    const {error}=await sb.from(table).update(rec).eq('id',id);
    if(error){toast('?숈젣 ????ㅽ뙣');console.error(error);return;}
    const list=isExp?(state.expTasks[ownerId]||[]):(state.tasks[ownerId]||[]);
    const t=list.find(x=>x.id===id);if(t)Object.assign(t,rec);
    closeModal('modal-create');state.editTarget=null;render();toast('??ν뻽?듬땲??);return;
  }
  if(isExp){rec.account_id=target.id;rec.sort_order=(state.expTasks[target.id]||[]).filter(t=>!t.parent_id).length;}
  else{rec.character_id=target.id;rec.sort_order=(state.tasks[target.id]||[]).filter(t=>!t.parent_id).length;}
  if(state.createParentId){
    rec.parent_id=state.createParentId;
    rec.sort_order=(isExp?(state.expTasks[target.id]||[]):(state.tasks[target.id]||[])).filter(t=>t.parent_id===state.createParentId).length;
    rec.rest_enabled=false;rec.rest_current=0;rec.rest_max=200;rec.rest_charge=20;rec.rest_consume=40;rec.rest_threshold=40;rec.rest_daily_limit=1;rec.rest_last_processed_at=null;rec.rest_consumed_current_cycle=0;
  }
  const {data,error}=await sb.from(table).insert(rec).select().single();
  if(error){toast('?숈젣 異붽? ?ㅽ뙣');console.error(error);return;}
  if(isExp){if(!state.expTasks[target.id])state.expTasks[target.id]=[];state.expTasks[target.id].push(data);}
  else{if(!state.tasks[target.id])state.tasks[target.id]=[];state.tasks[target.id].push(data);}
  closeModal('modal-create');render();toast('?숈젣瑜?異붽??덉뒿?덈떎');
}

  if(tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.target&&e.target.type==='button')return;
  const openModalEl=document.querySelector('.overlay.open .modal');
  if(!openModalEl||!openModalEl.contains(e.target))return;
  // Find primary button in this modal's footer (or fallback: any .btn.primary inside modal)
  const primary=openModalEl.querySelector('.modal-foot .btn.primary')||openModalEl.querySelector('.btn.primary');
  if(!primary||primary.disabled)return;
  e.preventDefault();
  primary.click();
});
